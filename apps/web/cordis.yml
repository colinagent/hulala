# Loop advice composition. This is the seed roster for a single structured
# AgentAdvice turn. Shell, sandbox, and subagent plugins stay out.
plugins:
  - id: cosmokit
    name: "@hulala/cosmokit"
  - id: cordis
    name: "@hulala/cordis"
  - id: session
    name: "@hulala/dsh-session"
  - id: system-prompt
    name: "@hulala/dsh-system-prompt"
  - id: llm
    name: "@hulala/dsh-llm"
  - id: llm-deepseek
    name: "@hulala/dsh-llm-deepseek"
  - id: tools
    name: "@hulala/dsh-tools"
  - id: agent
    name: "@hulala/dsh-agent"
  - id: agent-loop
    name: "@hulala/dsh-agent-loop"
